[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zulf-model"
version = "0.1.0"
description = "Simulation-trained candidate generation and general J refinement for ZULF NMR spectra"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = ["torch>=2.1"]
hdf5 = ["h5py>=3.8"]
plots = ["matplotlib>=3.7"]
dev = ["torch>=2.1", "h5py>=3.8", "matplotlib>=3.7"]

[project.scripts]
zulf-model = "zulf_model.cli:main"

[tool.setuptools.packages.find]
include = ["zulf_model*"]
