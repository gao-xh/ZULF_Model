[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zulf-model"
version = "0.1.0"
description = "ZULF NMR: zulf_core (physics, rendering, refinement; NumPy/SciPy), zulf_model (simulation-trained candidate generation; PyTorch) and zulf_hypothesis (programmatic chemical hypotheses and search; NumPy/SciPy)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = ["torch>=2.1"]
hdf5 = ["h5py>=3.8"]
plots = ["matplotlib>=3.7"]
figures = ["matplotlib>=3.7", "rdkit>=2023.9"]   # structure insets of scripts/paper_figure.py
dev = ["torch>=2.1", "h5py>=3.8", "matplotlib>=3.7"]

[project.scripts]
zulf-model = "zulf_model.cli:main"

[tool.setuptools.packages.find]
include = ["zulf_core*", "zulf_model*", "zulf_hypothesis*", "zulf_processing*"]

[tool.setuptools.package-data]
zulf_hypothesis = ["data/*.json"]
